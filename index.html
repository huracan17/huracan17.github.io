<title>Acceso privado</title>
<style>
:root{--bg:#111111;--fg:#f5f5f5;--acc:#F5C800;--muted:#9a9a9a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;padding:16px}
.box{width:100%;max-width:360px;text-align:center}h1{font-size:1.3rem;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px;font-size:.9rem}
input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #444;background:#1c1c1c;color:var(--fg);font-size:1rem}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#111;font-weight:700;font-size:1rem;cursor:pointer}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;color:var(--muted);font-size:.85rem}
#err{color:#ff7b7b;min-height:1.2em;margin-top:10px;font-size:.9rem}
